<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Grafo de Congo (Kinshasa)</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;margin:0;background:#f4f6f8;color:#1d2733}
header{padding:8px 16px;background:#1f3b5a;color:#fff;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
button{padding:4px 12px;border:0;border-radius:4px;background:#e8eef5;cursor:pointer}
#lienzo{height:72vh;background:#fff;border-bottom:1px solid #ccd}
#lienzo svg{width:100%;height:100%}
textarea{box-sizing:border-box;width:calc(100% - 32px);height:20vh;margin:8px 16px;font-family:Consolas,monospace;font-size:12px}
</style>
<script src="../recursos/mermaid.min.js"></script>
<script src="../recursos/svg-pan-zoom.min.js"></script>
</head>
<body>
<header><strong>Grafo de Congo (Kinshasa)</strong><button id="ajustar">Ajustar</button><button id="copiar">Copiar código Mermaid</button><span>Congo (Kinshasa): 18 aeropuertos, 39 rutas internas, 11 salen al exterior, 15 llegan del exterior</span></header>
<div id="lienzo"></div>
<textarea id="codigo" readonly>flowchart LR
    subgraph PAIS[&quot;Congo (Kinshasa): 18 de 18 aeropuertos&quot;]
        V_FIH[&quot;FIH&lt;br/&gt;Kinshasa&quot;]
        V_BKY[&quot;BKY&lt;br/&gt;Bukavu/kavumu&quot;]
        V_KND[&quot;KND&lt;br/&gt;Kindu&quot;]
        V_KOO[&quot;KOO&lt;br/&gt;Kongolo&quot;]
        V_BNB[&quot;BNB&lt;br/&gt;Boende&quot;]
        V_MDK[&quot;MDK&lt;br/&gt;Mbandaka&quot;]
        V_BNC[&quot;BNC&lt;br/&gt;Beni&quot;]
        V_BUX[&quot;BUX&lt;br/&gt;Bunia&quot;]
        V_GOM[&quot;GOM&lt;br/&gt;Goma&quot;]
        V_IRP[&quot;IRP&lt;br/&gt;Isiro&quot;]
        V_FBM[&quot;FBM&lt;br/&gt;Lubumashi&quot;]
        V_KGA[&quot;KGA&lt;br/&gt;Kananga&quot;]
        V_MJM[&quot;MJM&lt;br/&gt;Mbuji-mayi&quot;]
        V_FKI[&quot;FKI&lt;br/&gt;Kisangani&quot;]
        V_TSH[&quot;TSH&lt;br/&gt;Tshikapa&quot;]
        V_GMA[&quot;GMA&lt;br/&gt;Gemena&quot;]
        V_FMI[&quot;FMI&lt;br/&gt;Kalemie&quot;]
        V_LJA[&quot;LJA&lt;br/&gt;Lodja&quot;]
        V_FIH --&gt; V_BNB
        V_FIH &lt;--&gt; V_FBM
        V_FIH &lt;--&gt; V_FKI
        V_FIH &lt;--&gt; V_KGA
        V_FIH &lt;--&gt; V_KND
        V_FIH &lt;--&gt; V_MDK
        V_FIH &lt;--&gt; V_MJM
        V_FIH &lt;--&gt; V_TSH
        V_BKY &lt;--&gt; V_KND
        V_BKY --&gt; V_KOO
        V_KOO --&gt; V_FMI
        V_BNB --&gt; V_MDK
        V_MDK &lt;--&gt; V_GMA
        V_BNC &lt;--&gt; V_BUX
        V_BNC &lt;--&gt; V_GOM
        V_BUX --&gt; V_GOM
        V_BUX --&gt; V_IRP
        V_GOM --&gt; V_BKY
        V_GOM &lt;--&gt; V_FKI
        V_IRP --&gt; V_FKI
        V_FBM &lt;--&gt; V_KGA
        V_FBM &lt;--&gt; V_MJM
        V_KGA &lt;--&gt; V_TSH
        V_LJA --&gt; V_FIH
    end
    EXT0[&quot;Belgium&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT0
    click EXT0 &quot;grafo_Belgium.html&quot; &quot;Abrir país&quot;
    EXT1[&quot;Cameroon&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT1
    click EXT1 &quot;grafo_Cameroon.html&quot; &quot;Abrir país&quot;
    EXT2[&quot;France&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT2
    click EXT2 &quot;grafo_France.html&quot; &quot;Abrir país&quot;
    EXT3[&quot;Congo (Brazzaville)&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT3
    click EXT3 &quot;grafo_Congo_Brazzaville.html&quot; &quot;Abrir país&quot;
    EXT4[&quot;Gabon&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT4
    click EXT4 &quot;grafo_Gabon.html&quot; &quot;Abrir país&quot;
    EXT5[&quot;Kenya&quot;]
    PAIS --&gt;|&quot;2 rutas&quot;| EXT5
    click EXT5 &quot;grafo_Kenya.html&quot; &quot;Abrir país&quot;

    PAIS --&gt;|&quot;2 rutas&quot;| EXT6
    click EXT6 &quot;grafo_South_Africa.html&quot; &quot;Abrir país&quot;
    EXT7[&quot;Turkey&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT7
    click EXT7 &quot;grafo_Turkey.html&quot; &quot;Abrir país&quot;
    EXT8[&quot;Zambia&quot;]

    click EXT8 &quot;grafo_Zambia.html&quot; &quot;Abrir país&quot;
</textarea>
<script>
mermaid.initialize({startOnLoad:false,securityLevel:'loose',maxTextSize:5000000,maxEdges:50000,flowchart:{useMaxWidth:false,htmlLabels:true}});
var zoom=null;
mermaid.render('diagrama',document.getElementById('codigo').value).then(function(r){
  var lienzo=document.getElementById('lienzo');lienzo.innerHTML=r.svg;
  if(r.bindFunctions){r.bindFunctions(lienzo);}
  var svg=lienzo.querySelector('svg');svg.removeAttribute('style');
  svg.setAttribute('width','100%');svg.setAttribute('height','100%');
  zoom=svgPanZoom(svg,{zoomEnabled:true,controlIconsEnabled:true,fit:true,center:true,minZoom:0.05,maxZoom:50});
}).catch(function(e){document.getElementById('lienzo').innerHTML='<pre style="color:#a00;padding:16px">Error al dibujar: '+e+'</pre>';});
document.getElementById('ajustar').onclick=function(){if(zoom){zoom.resize();zoom.fit();zoom.center();}};
document.getElementById('copiar').onclick=function(){var t=document.getElementById('codigo');t.select();document.execCommand('copy');};
</script>
</body>
</html>
