<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Grafo de Cameroon</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;margin:0;background:#f4f6f8;color:#1d2733}
header{padding:8px 16px;background:#1f3b5a;color:#fff;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
button{padding:4px 12px;border:0;border-radius:4px;background:#e8eef5;cursor:pointer}
#lienzo{height:72vh;background:#fff;border-bottom:1px solid #ccd}
#lienzo svg{width:100%;height:100%}
textarea{box-sizing:border-box;width:calc(100% - 32px);height:20vh;margin:8px 16px;font-family:Consolas,monospace;font-size:12px}
</style>
<script src="../recursos/mermaid.min.js"></script>
<script src="../recursos/svg-pan-zoom.min.js"></script>
</head>
<body>
<header><strong>Grafo de Cameroon</strong><button id="ajustar">Ajustar</button><button id="copiar">Copiar código Mermaid</button><span>Cameroon: 5 aeropuertos, 8 rutas internas, 24 salen al exterior, 27 llegan del exterior</span></header>
<div id="lienzo"></div>
<textarea id="codigo" readonly>flowchart LR
    subgraph PAIS[&quot;Cameroon: 5 de 5 aeropuertos&quot;]
        V_DLA[&quot;DLA&lt;br/&gt;Douala&quot;]
        V_NSI[&quot;NSI&lt;br/&gt;Yaounde&quot;]
        V_GOU[&quot;GOU&lt;br/&gt;Garoua&quot;]
        V_MVR[&quot;MVR&lt;br/&gt;Maroua&quot;]
        V_NGE[&quot;NGE&lt;br/&gt;N'gaoundere&quot;]
        V_DLA &lt;--&gt; V_NSI
        V_DLA --&gt; V_GOU
        V_DLA --&gt; V_MVR
        V_NSI &lt;--&gt; V_GOU
        V_MVR --&gt; V_NSI
        V_NGE --&gt; V_NSI
    end
    EXT0[&quot;Senegal&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT0
    click EXT0 &quot;grafo_Senegal.html&quot; &quot;Abrir país&quot;
    EXT1[&quot;Nigeria&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT1
    click EXT1 &quot;grafo_Nigeria.html&quot; &quot;Abrir país&quot;
    EXT2[&quot;Belgium&quot;]
    PAIS --&gt;|&quot;2 rutas&quot;| EXT2
    click EXT2 &quot;grafo_Belgium.html&quot; &quot;Abrir país&quot;
    EXT3[&quot;Congo (Kinshasa)&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT3
    click EXT3 &quot;grafo_Congo_Kinshasa.html&quot; &quot;Abrir país&quot;
    EXT4[&quot;France&quot;]
    PAIS --&gt;|&quot;2 rutas&quot;| EXT4
    click EXT4 &quot;grafo_France.html&quot; &quot;Abrir país&quot;
    EXT5[&quot;Equatorial Guinea&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT5
    click EXT5 &quot;grafo_Equatorial_Guinea.html&quot; &quot;Abrir país&quot;
    EXT6[&quot;Central African Republic&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT6
    click EXT6 &quot;grafo_Central_African_Republic.html&quot; &quot;Abrir país&quot;
    EXT7[&quot;Morocco&quot;]
    PAIS --&gt;|&quot;2 rutas&quot;| EXT7
    click EXT7 &quot;grafo_Morocco.html&quot; &quot;Abrir país&quot;
    EXT8[&quot;Benin&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT8
    click EXT8 &quot;grafo_Benin.html&quot; &quot;Abrir país&quot;
    EXT9[&quot;Ethiopia&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT9
    click EXT9 &quot;grafo_Ethiopia.html&quot; &quot;Abrir país&quot;
    EXT10[&quot;Congo (Brazzaville)&quot;]
    PAIS --&gt;|&quot;2 rutas&quot;| EXT10
    click EXT10 &quot;grafo_Congo_Brazzaville.html&quot; &quot;Abrir país&quot;
    EXT11[&quot;Togo&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT11
    click EXT11 &quot;grafo_Togo.html&quot; &quot;Abrir país&quot;
    EXT12[&quot;Chad&quot;]
    PAIS --&gt;|&quot;2 rutas&quot;| EXT12
    click EXT12 &quot;grafo_Chad.html&quot; &quot;Abrir país&quot;
    EXT13[&quot;Cote d'Ivoire&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT13
    click EXT13 &quot;grafo_Cote_d_Ivoire.html&quot; &quot;Abrir país&quot;
    EXT14[&quot;Kenya&quot;]
    PAIS --&gt;|&quot;2 rutas&quot;| EXT14
    click EXT14 &quot;grafo_Kenya.html&quot; &quot;Abrir país&quot;
    EXT15[&quot;Gabon&quot;]
    PAIS --&gt;|&quot;2 rutas&quot;| EXT15
    click EXT15 &quot;grafo_Gabon.html&quot; &quot;Abrir país&quot;
    EXT16[&quot;Turkey&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT16
    click EXT16 &quot;grafo_Turkey.html&quot; &quot;Abrir país&quot;
</textarea>
<script>
mermaid.initialize({startOnLoad:false,securityLevel:'loose',maxTextSize:5000000,maxEdges:50000,flowchart:{useMaxWidth:false,htmlLabels:true}});
var zoom=null;
mermaid.render('diagrama',document.getElementById('codigo').value).then(function(r){
  var lienzo=document.getElementById('lienzo');lienzo.innerHTML=r.svg;
  if(r.bindFunctions){r.bindFunctions(lienzo);}
  var svg=lienzo.querySelector('svg');svg.removeAttribute('style');
  svg.setAttribute('width','100%');svg.setAttribute('height','100%');
  zoom=svgPanZoom(svg,{zoomEnabled:true,controlIconsEnabled:true,fit:true,center:true,minZoom:0.05,maxZoom:50});
}).catch(function(e){document.getElementById('lienzo').innerHTML='<pre style="color:#a00;padding:16px">Error al dibujar: '+e+'</pre>';});
document.getElementById('ajustar').onclick=function(){if(zoom){zoom.resize();zoom.fit();zoom.center();}};
document.getElementById('copiar').onclick=function(){var t=document.getElementById('codigo');t.select();document.execCommand('copy');};
</script>
</body>
</html>
