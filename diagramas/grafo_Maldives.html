<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Grafo de Maldives</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;margin:0;background:#f4f6f8;color:#1d2733}
header{padding:8px 16px;background:#1f3b5a;color:#fff;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
button{padding:4px 12px;border:0;border-radius:4px;background:#e8eef5;cursor:pointer}
#lienzo{height:72vh;background:#fff;border-bottom:1px solid #ccd}
#lienzo svg{width:100%;height:100%}
textarea{box-sizing:border-box;width:calc(100% - 32px);height:20vh;margin:8px 16px;font-family:Consolas,monospace;font-size:12px}
</style>
<script src="../recursos/mermaid.min.js"></script>
<script src="../recursos/svg-pan-zoom.min.js"></script>
</head>
<body>
<header><strong>Grafo de Maldives</strong><button id="ajustar">Ajustar</button><button id="copiar">Copiar código Mermaid</button><span>Maldives: 7 aeropuertos, 16 rutas internas, 25 salen al exterior, 23 llegan del exterior</span></header>
<div id="lienzo"></div>
<textarea id="codigo" readonly>flowchart LR
    subgraph PAIS[&quot;Maldives: 7 de 7 aeropuertos&quot;]
        V_MLE[&quot;MLE&lt;br/&gt;Male&quot;]
        V_GAN[&quot;GAN&lt;br/&gt;Gan Island&quot;]
        V_DRV[&quot;DRV&lt;br/&gt;DHARAVANDHOO&quot;]
        V_HAQ[&quot;HAQ&lt;br/&gt;Haa Dhaalu Atoll&quot;]
        V_KDM[&quot;KDM&lt;br/&gt;Kaadedhdhoo&quot;]
        V_GKK[&quot;GKK&lt;br/&gt;Kooddoo&quot;]
        V_KDO[&quot;KDO&lt;br/&gt;Laamu Atoll&quot;]
        V_MLE &lt;--&gt; V_DRV
        V_MLE &lt;--&gt; V_GAN
        V_MLE &lt;--&gt; V_GKK
        V_MLE &lt;--&gt; V_KDM
        V_MLE &lt;--&gt; V_KDO
        V_GAN &lt;--&gt; V_KDM
        V_DRV &lt;--&gt; V_HAQ
        V_GKK &lt;--&gt; V_KDO
    end
    EXT0[&quot;India&quot;]
    PAIS --&gt;|&quot;4 rutas&quot;| EXT0
    click EXT0 &quot;grafo_India.html&quot; &quot;Abrir país&quot;
    EXT1[&quot;United Arab Emirates&quot;]
    PAIS --&gt;|&quot;3 rutas&quot;| EXT1
    click EXT1 &quot;grafo_United_Arab_Emirates.html&quot; &quot;Abrir país&quot;
    EXT2[&quot;Sri Lanka&quot;]
    PAIS --&gt;|&quot;3 rutas&quot;| EXT2
    click EXT2 &quot;grafo_Sri_Lanka.html&quot; &quot;Abrir país&quot;
    EXT3[&quot;United Kingdom&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT3
    click EXT3 &quot;grafo_United_Kingdom.html&quot; &quot;Abrir país&quot;
    EXT4[&quot;Hong Kong&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT4
    click EXT4 &quot;grafo_Hong_Kong.html&quot; &quot;Abrir país&quot;
    EXT5[&quot;China&quot;]
    PAIS --&gt;|&quot;3 rutas&quot;| EXT5
    click EXT5 &quot;grafo_China.html&quot; &quot;Abrir país&quot;
    EXT6[&quot;Germany&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT6
    click EXT6 &quot;grafo_Germany.html&quot; &quot;Abrir país&quot;
    EXT7[&quot;Italy&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT7
    click EXT7 &quot;grafo_Italy.html&quot; &quot;Abrir país&quot;
    EXT8[&quot;Malaysia&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT8
    click EXT8 &quot;grafo_Malaysia.html&quot; &quot;Abrir país&quot;
    EXT9[&quot;Thailand&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT9
    click EXT9 &quot;grafo_Thailand.html&quot; &quot;Abrir país&quot;
    EXT10[&quot;Qatar&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT10
    click EXT10 &quot;grafo_Qatar.html&quot; &quot;Abrir país&quot;
    EXT11[&quot;Singapore&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT11
    click EXT11 &quot;grafo_Singapore.html&quot; &quot;Abrir país&quot;
    EXT12[&quot;Russia&quot;]
    PAIS --&gt;|&quot;2 rutas&quot;| EXT12
    click EXT12 &quot;grafo_Russia.html&quot; &quot;Abrir país&quot;
    EXT13[&quot;Turkey&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT13
    click EXT13 &quot;grafo_Turkey.html&quot; &quot;Abrir país&quot;
    EXT14[&quot;Oman&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT14
    click EXT14 &quot;grafo_Oman.html&quot; &quot;Abrir país&quot;
</textarea>
<script>
mermaid.initialize({startOnLoad:false,securityLevel:'loose',maxTextSize:5000000,maxEdges:50000,flowchart:{useMaxWidth:false,htmlLabels:true}});
var zoom=null;
mermaid.render('diagrama',document.getElementById('codigo').value).then(function(r){
  var lienzo=document.getElementById('lienzo');lienzo.innerHTML=r.svg;
  if(r.bindFunctions){r.bindFunctions(lienzo);}
  var svg=lienzo.querySelector('svg');svg.removeAttribute('style');
  svg.setAttribute('width','100%');svg.setAttribute('height','100%');
  zoom=svgPanZoom(svg,{zoomEnabled:true,controlIconsEnabled:true,fit:true,center:true,minZoom:0.05,maxZoom:50});
}).catch(function(e){document.getElementById('lienzo').innerHTML='<pre style="color:#a00;padding:16px">Error al dibujar: '+e+'</pre>';});
document.getElementById('ajustar').onclick=function(){if(zoom){zoom.resize();zoom.fit();zoom.center();}};
document.getElementById('copiar').onclick=function(){var t=document.getElementById('codigo');t.select();document.execCommand('copy');};
</script>
</body>
</html>
