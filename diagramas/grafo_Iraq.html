<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Grafo de Iraq</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;margin:0;background:#f4f6f8;color:#1d2733}
header{padding:8px 16px;background:#1f3b5a;color:#fff;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
button{padding:4px 12px;border:0;border-radius:4px;background:#e8eef5;cursor:pointer}
#lienzo{height:72vh;background:#fff;border-bottom:1px solid #ccd}
#lienzo svg{width:100%;height:100%}
textarea{box-sizing:border-box;width:calc(100% - 32px);height:20vh;margin:8px 16px;font-family:Consolas,monospace;font-size:12px}
</style>
<script src="../recursos/mermaid.min.js"></script>
<script src="../recursos/svg-pan-zoom.min.js"></script>
</head>
<body>
<header><strong>Grafo de Iraq</strong><button id="ajustar">Ajustar</button><button id="copiar">Copiar código Mermaid</button><span>Iraq: 6 aeropuertos, 0 rutas internas, 59 salen al exterior, 58 llegan del exterior</span></header>
<div id="lienzo"></div>
<textarea id="codigo" readonly>flowchart LR
    subgraph PAIS[&quot;Iraq: 6 de 6 aeropuertos&quot;]
        V_BGW[&quot;BGW&lt;br/&gt;Baghdad&quot;]
        V_BSR[&quot;BSR&lt;br/&gt;Basrah&quot;]
        V_EBL[&quot;EBL&lt;br/&gt;Erbil&quot;]
        V_ISU[&quot;ISU&lt;br/&gt;Sulaymaniyah&quot;]
        V_NJF[&quot;NJF&lt;br/&gt;Najaf&quot;]
        V_OSM[&quot;OSM&lt;br/&gt;Mosul&quot;]
    end
    EXT0[&quot;United Arab Emirates&quot;]
    PAIS --&gt;|&quot;12 rutas&quot;| EXT0
    click EXT0 &quot;grafo_United_Arab_Emirates.html&quot; &quot;Abrir país&quot;
    EXT1[&quot;Bahrain&quot;]
    PAIS --&gt;|&quot;2 rutas&quot;| EXT1
    click EXT1 &quot;grafo_Bahrain.html&quot; &quot;Abrir país&quot;
    EXT2[&quot;Lebanon&quot;]
    PAIS --&gt;|&quot;4 rutas&quot;| EXT2
    click EXT2 &quot;grafo_Lebanon.html&quot; &quot;Abrir país&quot;
    EXT3[&quot;Egypt&quot;]
    PAIS --&gt;|&quot;2 rutas&quot;| EXT3
    click EXT3 &quot;grafo_Egypt.html&quot; &quot;Abrir país&quot;
    EXT4[&quot;Qatar&quot;]
    PAIS --&gt;|&quot;5 rutas&quot;| EXT4
    click EXT4 &quot;grafo_Qatar.html&quot; &quot;Abrir país&quot;
    EXT5[&quot;Jordan&quot;]
    PAIS --&gt;|&quot;6 rutas&quot;| EXT5
    click EXT5 &quot;grafo_Jordan.html&quot; &quot;Abrir país&quot;
    EXT6[&quot;Turkey&quot;]
    PAIS --&gt;|&quot;11 rutas&quot;| EXT6
    click EXT6 &quot;grafo_Turkey.html&quot; &quot;Abrir país&quot;
    EXT7[&quot;Georgia&quot;]
    PAIS --&gt;|&quot;2 rutas&quot;| EXT7
    click EXT7 &quot;grafo_Georgia.html&quot; &quot;Abrir país&quot;
    EXT8[&quot;Sweden&quot;]
    PAIS --&gt;|&quot;4 rutas&quot;| EXT8
    click EXT8 &quot;grafo_Sweden.html&quot; &quot;Abrir país&quot;
    EXT9[&quot;Netherlands&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT9
    click EXT9 &quot;grafo_Netherlands.html&quot; &quot;Abrir país&quot;
    EXT10[&quot;Germany&quot;]
    PAIS --&gt;|&quot;5 rutas&quot;| EXT10
    click EXT10 &quot;grafo_Germany.html&quot; &quot;Abrir país&quot;
    EXT11[&quot;Austria&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT11
    click EXT11 &quot;grafo_Austria.html&quot; &quot;Abrir país&quot;
    EXT12[&quot;Iran&quot;]
    PAIS --&gt;|&quot;3 rutas&quot;| EXT12
    click EXT12 &quot;grafo_Iran.html&quot; &quot;Abrir país&quot;
    EXT13[&quot;Kuwait&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT13
    click EXT13 &quot;grafo_Kuwait.html&quot; &quot;Abrir país&quot;
</textarea>
<script>
mermaid.initialize({startOnLoad:false,securityLevel:'loose',maxTextSize:5000000,maxEdges:50000,flowchart:{useMaxWidth:false,htmlLabels:true}});
var zoom=null;
mermaid.render('diagrama',document.getElementById('codigo').value).then(function(r){
  var lienzo=document.getElementById('lienzo');lienzo.innerHTML=r.svg;
  if(r.bindFunctions){r.bindFunctions(lienzo);}
  var svg=lienzo.querySelector('svg');svg.removeAttribute('style');
  svg.setAttribute('width','100%');svg.setAttribute('height','100%');
  zoom=svgPanZoom(svg,{zoomEnabled:true,controlIconsEnabled:true,fit:true,center:true,minZoom:0.05,maxZoom:50});
}).catch(function(e){document.getElementById('lienzo').innerHTML='<pre style="color:#a00;padding:16px">Error al dibujar: '+e+'</pre>';});
document.getElementById('ajustar').onclick=function(){if(zoom){zoom.resize();zoom.fit();zoom.center();}};
document.getElementById('copiar').onclick=function(){var t=document.getElementById('codigo');t.select();document.execCommand('copy');};
</script>
</body>
</html>
