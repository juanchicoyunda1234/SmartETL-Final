<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Grafo de Solomon Islands</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;margin:0;background:#f4f6f8;color:#1d2733}
header{padding:8px 16px;background:#1f3b5a;color:#fff;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
button{padding:4px 12px;border:0;border-radius:4px;background:#e8eef5;cursor:pointer}
#lienzo{height:72vh;background:#fff;border-bottom:1px solid #ccd}
#lienzo svg{width:100%;height:100%}
textarea{box-sizing:border-box;width:calc(100% - 32px);height:20vh;margin:8px 16px;font-family:Consolas,monospace;font-size:12px}
</style>
<script src="../recursos/mermaid.min.js"></script>
<script src="../recursos/svg-pan-zoom.min.js"></script>
</head>
<body>
<header><strong>Grafo de Solomon Islands</strong><button id="ajustar">Ajustar</button><button id="copiar">Copiar código Mermaid</button><span>Solomon Islands: 16 aeropuertos, 46 rutas internas, 4 salen al exterior, 4 llegan del exterior</span></header>
<div id="lienzo"></div>
<textarea id="codigo" readonly>flowchart LR
    subgraph PAIS[&quot;Solomon Islands: 16 de 16 aeropuertos&quot;]
        V_HIR[&quot;HIR&lt;br/&gt;Honiara&quot;]
        V_ATD[&quot;ATD&lt;br/&gt;Atoifi&quot;]
        V_CHY[&quot;CHY&lt;br/&gt;Choiseul Bay&quot;]
        V_GZO[&quot;GZO&lt;br/&gt;Gizo&quot;]
        V_EGM[&quot;EGM&lt;br/&gt;Sege&quot;]
        V_RBV[&quot;RBV&lt;br/&gt;Ramata&quot;]
        V_VAO[&quot;VAO&lt;br/&gt;Suavanao&quot;]
        V_FRE[&quot;FRE&lt;br/&gt;Fera Island&quot;]
        V_MUA[&quot;MUA&lt;br/&gt;Munda&quot;]
        V_IRA[&quot;IRA&lt;br/&gt;Kirakira&quot;]
        V_KGE[&quot;KGE&lt;br/&gt;Kagau Island&quot;]
        V_NNB[&quot;NNB&lt;br/&gt;Santa Ana&quot;]
        V_RNA[&quot;RNA&lt;br/&gt;Ulawa&quot;]
        V_RNL[&quot;RNL&lt;br/&gt;Rennell Island&quot;]
        V_RUS[&quot;RUS&lt;br/&gt;Marau&quot;]
        V_SCZ[&quot;SCZ&lt;br/&gt;Santa Cruz/Graciosa Bay/Luova&quot;]
        V_HIR &lt;--&gt; V_ATD
        V_HIR --&gt; V_CHY
        V_HIR &lt;--&gt; V_EGM
        V_HIR &lt;--&gt; V_FRE
        V_HIR &lt;--&gt; V_GZO
        V_HIR &lt;--&gt; V_IRA
        V_HIR --&gt; V_KGE
        V_HIR &lt;--&gt; V_MUA
        V_HIR &lt;--&gt; V_NNB
        V_HIR &lt;--&gt; V_RBV
        V_HIR &lt;--&gt; V_RNA
        V_HIR &lt;--&gt; V_RNL
        V_HIR &lt;--&gt; V_RUS
        V_HIR &lt;--&gt; V_SCZ
        V_HIR &lt;--&gt; V_VAO
        V_CHY &lt;--&gt; V_GZO
        V_GZO &lt;--&gt; V_EGM
        V_GZO &lt;--&gt; V_MUA
        V_EGM --&gt; V_RBV
        V_EGM --&gt; V_VAO
        V_RBV --&gt; V_MUA
        V_FRE --&gt; V_VAO
        V_MUA --&gt; V_EGM
        V_MUA &lt;--&gt; V_KGE
        V_IRA &lt;--&gt; V_NNB
        V_IRA &lt;--&gt; V_RNA
        V_KGE --&gt; V_GZO
    end
    EXT0[&quot;Vanuatu&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT0
    click EXT0 &quot;grafo_Vanuatu.html&quot; &quot;Abrir país&quot;
    EXT1[&quot;Australia&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT1
    click EXT1 &quot;grafo_Australia.html&quot; &quot;Abrir país&quot;
    EXT2[&quot;Fiji&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT2
    click EXT2 &quot;grafo_Fiji.html&quot; &quot;Abrir país&quot;
    EXT3[&quot;Papua New Guinea&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT3
    click EXT3 &quot;grafo_Papua_New_Guinea.html&quot; &quot;Abrir país&quot;
</textarea>
<script>
mermaid.initialize({startOnLoad:false,securityLevel:'loose',maxTextSize:5000000,maxEdges:50000,flowchart:{useMaxWidth:false,htmlLabels:true}});
var zoom=null;
mermaid.render('diagrama',document.getElementById('codigo').value).then(function(r){
  var lienzo=document.getElementById('lienzo');lienzo.innerHTML=r.svg;
  if(r.bindFunctions){r.bindFunctions(lienzo);}
  var svg=lienzo.querySelector('svg');svg.removeAttribute('style');
  svg.setAttribute('width','100%');svg.setAttribute('height','100%');
  zoom=svgPanZoom(svg,{zoomEnabled:true,controlIconsEnabled:true,fit:true,center:true,minZoom:0.05,maxZoom:50});
}).catch(function(e){document.getElementById('lienzo').innerHTML='<pre style="color:#a00;padding:16px">Error al dibujar: '+e+'</pre>';});
document.getElementById('ajustar').onclick=function(){if(zoom){zoom.resize();zoom.fit();zoom.center();}};
document.getElementById('copiar').onclick=function(){var t=document.getElementById('codigo');t.select();document.execCommand('copy');};
</script>
</body>
</html>
