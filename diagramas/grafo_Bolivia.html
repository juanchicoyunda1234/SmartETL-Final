<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Grafo de Bolivia</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;margin:0;background:#f4f6f8;color:#1d2733}
header{padding:8px 16px;background:#1f3b5a;color:#fff;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
button{padding:4px 12px;border:0;border-radius:4px;background:#e8eef5;cursor:pointer}
#lienzo{height:72vh;background:#fff;border-bottom:1px solid #ccd}
#lienzo svg{width:100%;height:100%}
textarea{box-sizing:border-box;width:calc(100% - 32px);height:20vh;margin:8px 16px;font-family:Consolas,monospace;font-size:12px}
</style>
<script src="../recursos/mermaid.min.js"></script>
<script src="../recursos/svg-pan-zoom.min.js"></script>
</head>
<body>
<header><strong>Grafo de Bolivia</strong><button id="ajustar">Ajustar</button><button id="copiar">Copiar código Mermaid</button><span>Bolivia: 15 aeropuertos, 52 rutas internas, 14 salen al exterior, 15 llegan del exterior</span></header>
<div id="lienzo"></div>
<textarea id="codigo" readonly>flowchart LR
    subgraph PAIS[&quot;Bolivia: 15 de 15 aeropuertos&quot;]
        V_BYC[&quot;BYC&lt;br/&gt;Yacuiba&quot;]
        V_SRZ[&quot;SRZ&lt;br/&gt;Santa Cruz&quot;]
        V_TJA[&quot;TJA&lt;br/&gt;Tarija&quot;]
        V_CBB[&quot;CBB&lt;br/&gt;Cochabamba&quot;]
        V_TDD[&quot;TDD&lt;br/&gt;Trinidad&quot;]
        V_CIJ[&quot;CIJ&lt;br/&gt;Cobija&quot;]
        V_GYA[&quot;GYA&lt;br/&gt;Guayaramerín&quot;]
        V_LPB[&quot;LPB&lt;br/&gt;La Paz&quot;]
        V_POI[&quot;POI&lt;br/&gt;Potosi&quot;]
        V_ORU[&quot;ORU&lt;br/&gt;Oruro&quot;]
        V_RIB[&quot;RIB&lt;br/&gt;Riberalta&quot;]
        V_VVI[&quot;VVI&lt;br/&gt;Santa Cruz&quot;]
        V_SRE[&quot;SRE&lt;br/&gt;Sucre&quot;]
        V_RBQ[&quot;RBQ&lt;br/&gt;Rerrenabaque&quot;]
        V_UYU[&quot;UYU&lt;br/&gt;Uyuni&quot;]
        V_BYC &lt;--&gt; V_SRZ
        V_BYC &lt;--&gt; V_TJA
        V_SRZ &lt;--&gt; V_LPB
        V_SRZ &lt;--&gt; V_ORU
        V_SRZ &lt;--&gt; V_TDD
        V_TJA &lt;--&gt; V_CBB
        V_TJA &lt;--&gt; V_LPB
        V_TJA &lt;--&gt; V_VVI
        V_TJA &lt;--&gt; V_SRE
        V_CBB &lt;--&gt; V_TDD
        V_CBB &lt;--&gt; V_CIJ
        V_CBB &lt;--&gt; V_LPB
        V_CBB &lt;--&gt; V_SRE
        V_CBB &lt;--&gt; V_VVI
        V_TDD &lt;--&gt; V_CIJ
        V_TDD &lt;--&gt; V_GYA
        V_TDD &lt;--&gt; V_LPB
        V_TDD &lt;--&gt; V_RIB
        V_TDD &lt;--&gt; V_RBQ
        V_LPB &lt;--&gt; V_POI
        V_LPB &lt;--&gt; V_VVI
        V_LPB --&gt; V_CIJ
        V_LPB &lt;--&gt; V_SRE
        V_LPB &lt;--&gt; V_RBQ
        V_LPB &lt;--&gt; V_UYU
        V_ORU --&gt; V_CBB
        V_VVI &lt;--&gt; V_SRE
    end
    EXT0[&quot;Peru&quot;]
    PAIS --&gt;|&quot;4 rutas&quot;| EXT0
    click EXT0 &quot;grafo_Peru.html&quot; &quot;Abrir país&quot;
    EXT1[&quot;Colombia&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT1
    click EXT1 &quot;grafo_Colombia.html&quot; &quot;Abrir país&quot;
    EXT2[&quot;Chile&quot;]
    PAIS --&gt;|&quot;3 rutas&quot;| EXT2
    click EXT2 &quot;grafo_Chile.html&quot; &quot;Abrir país&quot;
    EXT3[&quot;United States&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT3
    click EXT3 &quot;grafo_United_States.html&quot; &quot;Abrir país&quot;
    EXT4[&quot;Argentina&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT4
    click EXT4 &quot;grafo_Argentina.html&quot; &quot;Abrir país&quot;
    EXT5[&quot;Panama&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT5
    click EXT5 &quot;grafo_Panama.html&quot; &quot;Abrir país&quot;
    EXT6[&quot;Brazil&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT6
    click EXT6 &quot;grafo_Brazil.html&quot; &quot;Abrir país&quot;
    EXT7[&quot;Spain&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT7
    click EXT7 &quot;grafo_Spain.html&quot; &quot;Abrir país&quot;
    EXT8[&quot;Paraguay&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT8
    click EXT8 &quot;grafo_Paraguay.html&quot; &quot;Abrir país&quot;
</textarea>
<script>
mermaid.initialize({startOnLoad:false,securityLevel:'loose',maxTextSize:5000000,maxEdges:50000,flowchart:{useMaxWidth:false,htmlLabels:true}});
var zoom=null;
mermaid.render('diagrama',document.getElementById('codigo').value).then(function(r){
  var lienzo=document.getElementById('lienzo');lienzo.innerHTML=r.svg;
  if(r.bindFunctions){r.bindFunctions(lienzo);}
  var svg=lienzo.querySelector('svg');svg.removeAttribute('style');
  svg.setAttribute('width','100%');svg.setAttribute('height','100%');
  zoom=svgPanZoom(svg,{zoomEnabled:true,controlIconsEnabled:true,fit:true,center:true,minZoom:0.05,maxZoom:50});
}).catch(function(e){document.getElementById('lienzo').innerHTML='<pre style="color:#a00;padding:16px">Error al dibujar: '+e+'</pre>';});
document.getElementById('ajustar').onclick=function(){if(zoom){zoom.resize();zoom.fit();zoom.center();}};
document.getElementById('copiar').onclick=function(){var t=document.getElementById('codigo');t.select();document.execCommand('copy');};
</script>
</body>
</html>
