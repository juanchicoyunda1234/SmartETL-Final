<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Grafo de Costa Rica</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;margin:0;background:#f4f6f8;color:#1d2733}
header{padding:8px 16px;background:#1f3b5a;color:#fff;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
button{padding:4px 12px;border:0;border-radius:4px;background:#e8eef5;cursor:pointer}
#lienzo{height:72vh;background:#fff;border-bottom:1px solid #ccd}
#lienzo svg{width:100%;height:100%}
textarea{box-sizing:border-box;width:calc(100% - 32px);height:20vh;margin:8px 16px;font-family:Consolas,monospace;font-size:12px}
</style>
<script src="../recursos/mermaid.min.js"></script>
<script src="../recursos/svg-pan-zoom.min.js"></script>
</head>
<body>
<header><strong>Grafo de Costa Rica</strong><button id="ajustar">Ajustar</button><button id="copiar">Copiar código Mermaid</button><span>Costa Rica: 13 aeropuertos, 30 rutas internas, 39 salen al exterior, 39 llegan del exterior</span></header>
<div id="lienzo"></div>
<textarea id="codigo" readonly>flowchart LR
    subgraph PAIS[&quot;Costa Rica: 13 de 13 aeropuertos&quot;]
        V_SJO[&quot;SJO&lt;br/&gt;San Jose&quot;]
        V_DRK[&quot;DRK&lt;br/&gt;Puntarenas&quot;]
        V_FON[&quot;FON&lt;br/&gt;La Fortuna/San Carlos&quot;]
        V_XQP[&quot;XQP&lt;br/&gt;Quepos&quot;]
        V_GLF[&quot;GLF&lt;br/&gt;Golfito&quot;]
        V_PJM[&quot;PJM&lt;br/&gt;Puerto Jimenez&quot;]
        V_LIR[&quot;LIR&lt;br/&gt;Liberia&quot;]
        V_SYQ[&quot;SYQ&lt;br/&gt;San Jose&quot;]
        V_MRCV[&quot;MRCV&lt;br/&gt;Nicoya&quot;]
        V_NOB[&quot;NOB&lt;br/&gt;Nosara Beach&quot;]
        V_TMU[&quot;TMU&lt;br/&gt;Nicoya&quot;]
        V_PMZ[&quot;PMZ&lt;br/&gt;Palmar Sur&quot;]
        V_TTQ[&quot;TTQ&lt;br/&gt;Roxana&quot;]
        V_SJO &lt;--&gt; V_DRK
        V_SJO &lt;--&gt; V_FON
        V_SJO &lt;--&gt; V_GLF
        V_SJO --&gt; V_NOB
        V_SJO &lt;--&gt; V_PJM
        V_SJO &lt;--&gt; V_TMU
        V_SJO &lt;--&gt; V_MRCV
        V_SJO &lt;--&gt; V_TTQ
        V_SJO &lt;--&gt; V_XQP
        V_SJO &lt;--&gt; V_LIR
        V_SJO &lt;--&gt; V_PMZ
        V_FON --&gt; V_XQP
        V_XQP --&gt; V_PMZ
        V_GLF &lt;--&gt; V_PJM
        V_LIR &lt;--&gt; V_SYQ
        V_LIR &lt;--&gt; V_MRCV
        V_NOB --&gt; V_TMU
    end
    EXT0[&quot;Mexico&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT0
    click EXT0 &quot;grafo_Mexico.html&quot; &quot;Abrir país&quot;
    EXT1[&quot;Panama&quot;]
    PAIS --&gt;|&quot;4 rutas&quot;| EXT1
    click EXT1 &quot;grafo_Panama.html&quot; &quot;Abrir país&quot;
    EXT2[&quot;Nicaragua&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT2
    click EXT2 &quot;grafo_Nicaragua.html&quot; &quot;Abrir país&quot;
    EXT3[&quot;United States&quot;]
    PAIS --&gt;|&quot;22 rutas&quot;| EXT3
    click EXT3 &quot;grafo_United_States.html&quot; &quot;Abrir país&quot;
    EXT4[&quot;Canada&quot;]
    PAIS --&gt;|&quot;2 rutas&quot;| EXT4
    click EXT4 &quot;grafo_Canada.html&quot; &quot;Abrir país&quot;
    EXT5[&quot;Colombia&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT5
    click EXT5 &quot;grafo_Colombia.html&quot; &quot;Abrir país&quot;
    EXT6[&quot;Guatemala&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT6
    click EXT6 &quot;grafo_Guatemala.html&quot; &quot;Abrir país&quot;
    EXT7[&quot;Peru&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT7
    click EXT7 &quot;grafo_Peru.html&quot; &quot;Abrir país&quot;
    EXT8[&quot;El Salvador&quot;]
    PAIS --&gt;|&quot;2 rutas&quot;| EXT8
    click EXT8 &quot;grafo_El_Salvador.html&quot; &quot;Abrir país&quot;
    EXT9[&quot;Honduras&quot;]
    PAIS --&gt;|&quot;2 rutas&quot;| EXT9
    click EXT9 &quot;grafo_Honduras.html&quot; &quot;Abrir país&quot;
    EXT10[&quot;Dominican Republic&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT10
    click EXT10 &quot;grafo_Dominican_Republic.html&quot; &quot;Abrir país&quot;
    EXT11[&quot;Spain&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT11
    click EXT11 &quot;grafo_Spain.html&quot; &quot;Abrir país&quot;
</textarea>
<script>
mermaid.initialize({startOnLoad:false,securityLevel:'loose',maxTextSize:5000000,maxEdges:50000,flowchart:{useMaxWidth:false,htmlLabels:true}});
var zoom=null;
mermaid.render('diagrama',document.getElementById('codigo').value).then(function(r){
  var lienzo=document.getElementById('lienzo');lienzo.innerHTML=r.svg;
  if(r.bindFunctions){r.bindFunctions(lienzo);}
  var svg=lienzo.querySelector('svg');svg.removeAttribute('style');
  svg.setAttribute('width','100%');svg.setAttribute('height','100%');
  zoom=svgPanZoom(svg,{zoomEnabled:true,controlIconsEnabled:true,fit:true,center:true,minZoom:0.05,maxZoom:50});
}).catch(function(e){document.getElementById('lienzo').innerHTML='<pre style="color:#a00;padding:16px">Error al dibujar: '+e+'</pre>';});
document.getElementById('ajustar').onclick=function(){if(zoom){zoom.resize();zoom.fit();zoom.center();}};
document.getElementById('copiar').onclick=function(){var t=document.getElementById('codigo');t.select();document.execCommand('copy');};
</script>
</body>
</html>
