<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Grafo de Madagascar</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;margin:0;background:#f4f6f8;color:#1d2733}
header{padding:8px 16px;background:#1f3b5a;color:#fff;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
button{padding:4px 12px;border:0;border-radius:4px;background:#e8eef5;cursor:pointer}
#lienzo{height:72vh;background:#fff;border-bottom:1px solid #ccd}
#lienzo svg{width:100%;height:100%}
textarea{box-sizing:border-box;width:calc(100% - 32px);height:20vh;margin:8px 16px;font-family:Consolas,monospace;font-size:12px}
</style>
<script src="../recursos/mermaid.min.js"></script>
<script src="../recursos/svg-pan-zoom.min.js"></script>
</head>
<body>
<header><strong>Grafo de Madagascar</strong><button id="ajustar">Ajustar</button><button id="copiar">Copiar código Mermaid</button><span>Madagascar: 13 aeropuertos, 42 rutas internas, 17 salen al exterior, 16 llegan del exterior</span></header>
<div id="lienzo"></div>
<textarea id="codigo" readonly>flowchart LR
    subgraph PAIS[&quot;Madagascar: 13 de 13 aeropuertos&quot;]
        V_TNR[&quot;TNR&lt;br/&gt;Antananarivo&quot;]
        V_ANM[&quot;ANM&lt;br/&gt;Antalaha&quot;]
        V_TMM[&quot;TMM&lt;br/&gt;Toamasina&quot;]
        V_WMN[&quot;WMN&lt;br/&gt;Maroantsetra&quot;]
        V_DIE[&quot;DIE&lt;br/&gt;Antsiranana&quot;]
        V_NOS[&quot;NOS&lt;br/&gt;Nosy-be&quot;]
        V_SVB[&quot;SVB&lt;br/&gt;Sambava&quot;]
        V_MJN[&quot;MJN&lt;br/&gt;Mahajanga&quot;]
        V_FTU[&quot;FTU&lt;br/&gt;Tolagnaro&quot;]
        V_TLE[&quot;TLE&lt;br/&gt;Toliara&quot;]
        V_MOQ[&quot;MOQ&lt;br/&gt;Morondava&quot;]
        V_SMS[&quot;SMS&lt;br/&gt;Sainte Marie&quot;]
        V_WMR[&quot;WMR&lt;br/&gt;Mananara&quot;]
        V_TNR &lt;--&gt; V_ANM
        V_TNR &lt;--&gt; V_DIE
        V_TNR &lt;--&gt; V_FTU
        V_TNR &lt;--&gt; V_MJN
        V_TNR &lt;--&gt; V_MOQ
        V_TNR &lt;--&gt; V_NOS
        V_TNR &lt;--&gt; V_SMS
        V_TNR &lt;--&gt; V_SVB
        V_TNR &lt;--&gt; V_TLE
        V_TNR &lt;--&gt; V_TMM
        V_TNR &lt;--&gt; V_WMN
        V_ANM &lt;--&gt; V_TMM
        V_ANM &lt;--&gt; V_WMN
        V_TMM &lt;--&gt; V_SMS
        V_TMM &lt;--&gt; V_WMN
        V_TMM &lt;--&gt; V_WMR
        V_WMN &lt;--&gt; V_SVB
        V_DIE &lt;--&gt; V_NOS
        V_DIE &lt;--&gt; V_SVB
        V_FTU &lt;--&gt; V_TLE
        V_TLE &lt;--&gt; V_MOQ
    end
    EXT0[&quot;France&quot;]
    PAIS --&gt;|&quot;3 rutas&quot;| EXT0
    click EXT0 &quot;grafo_France.html&quot; &quot;Abrir país&quot;
    EXT1[&quot;Kenya&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT1
    click EXT1 &quot;grafo_Kenya.html&quot; &quot;Abrir país&quot;
    EXT2[&quot;Thailand&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT2
    click EXT2 &quot;grafo_Thailand.html&quot; &quot;Abrir país&quot;
    EXT3[&quot;Mayotte&quot;]
    PAIS --&gt;|&quot;4 rutas&quot;| EXT3
    click EXT3 &quot;grafo_Mayotte.html&quot; &quot;Abrir país&quot;
    EXT4[&quot;Comoros&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT4
    click EXT4 &quot;grafo_Comoros.html&quot; &quot;Abrir país&quot;
    EXT5[&quot;South Africa&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT5
    click EXT5 &quot;grafo_South_Africa.html&quot; &quot;Abrir país&quot;
    EXT6[&quot;Mauritius&quot;]
    PAIS --&gt;|&quot;1 ruta&quot;| EXT6
    click EXT6 &quot;grafo_Mauritius.html&quot; &quot;Abrir país&quot;
    EXT7[&quot;Reunion&quot;]
    PAIS --&gt;|&quot;5 rutas&quot;| EXT7
    click EXT7 &quot;grafo_Reunion.html&quot; &quot;Abrir país&quot;
</textarea>
<script>
mermaid.initialize({startOnLoad:false,securityLevel:'loose',maxTextSize:5000000,maxEdges:50000,flowchart:{useMaxWidth:false,htmlLabels:true}});
var zoom=null;
mermaid.render('diagrama',document.getElementById('codigo').value).then(function(r){
  var lienzo=document.getElementById('lienzo');lienzo.innerHTML=r.svg;
  if(r.bindFunctions){r.bindFunctions(lienzo);}
  var svg=lienzo.querySelector('svg');svg.removeAttribute('style');
  svg.setAttribute('width','100%');svg.setAttribute('height','100%');
  zoom=svgPanZoom(svg,{zoomEnabled:true,controlIconsEnabled:true,fit:true,center:true,minZoom:0.05,maxZoom:50});
}).catch(function(e){document.getElementById('lienzo').innerHTML='<pre style="color:#a00;padding:16px">Error al dibujar: '+e+'</pre>';});
document.getElementById('ajustar').onclick=function(){if(zoom){zoom.resize();zoom.fit();zoom.center();}};
document.getElementById('copiar').onclick=function(){var t=document.getElementById('codigo');t.select();document.execCommand('copy');};
</script>
</body>
</html>
